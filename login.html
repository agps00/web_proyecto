<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixNow - Iniciar sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <div class="contenedor cabecera">

            <a href="index.html" class="logo">FixNow</a>

            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Servicios</a></li>
                    <li><a href="formulario.html">Solicitar reparación</a></li>
                    <li><a href="login.html">Iniciar sesión</a></li>
                    <li><a href="carrito.html">Carrito</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <main class="contenedor">

        <section class="formulario login">

            <h1>Iniciar sesión</h1>

            <p>Accede a tu cuenta de FixNow.</p>

            <form action="#" method="post">

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>

                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" required>

                <p>
                    <button type="submit" class="boton">Entrar</button>
                </p>

            </form>

            <p>
                ¿Todavía no tienes una cuenta?
                <a href="formulario.html">Solicita tu primera reparación</a>.
            </p>

        </section>

    </main>

    <footer>
        <p>FixNow - Your repair. One tap away.</p>
    </footer>

</body>
</html>
